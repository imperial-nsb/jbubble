[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "jbubble"
dynamic = ["version"]
description = "Differentiable microbubble dynamics in JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Callum Rhys Tilbury" }]
keywords = [
    "jax",
    "microbubbles",
    "ultrasound",
    "contrast agents",
    "cavitation",
    "differentiable simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# Lower bounds are the oldest versions CI tests (the `lowest-direct` job).
# No upper bounds: a weekly CI job tests the newest releases instead.
dependencies = [
    "jax>=0.8.1",
    # diffrax 0.7.0 and 0.7.1 paired with optimistix 0.1.0 reject every implicit
    # (Kvaerno) step; 0.7.2 is the first release that supports optimistix 0.1.
    "diffrax>=0.7.2",
    # 0.13.3 crashed on scan-of-vmap of modules with default fields
    # (equinox#1172); 0.13.4 is also the first release tested with jax>=0.8.2.
    "equinox>=0.13.4",
    # Not imported directly. lineax<=0.0.8 raises TracerBoolConversionError in
    # implicit solvers with jax>=0.8.2 (lineax#187), fixed in 0.1.0.
    "lineax>=0.1.0",
    "optax>=0.2.3",
    "numpy>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# HDF5 export (jbubble.utils.io). h5py 3.11 is the first release built for NumPy 2.
io = ["h5py>=3.11"]
# Plotting for the example scripts and notebooks.
examples = ["matplotlib>=3.9"]

[project.urls]
Homepage = "https://github.com/imperial-nsb/jbubble"
Documentation = "https://imperial-nsb.github.io/jbubble/"
Source = "https://github.com/imperial-nsb/jbubble"
Issues = "https://github.com/imperial-nsb/jbubble/issues"
Changelog = "https://github.com/imperial-nsb/jbubble/releases"

# PEP 735 groups: local development only, never published.
# `uv sync` installs the `dev` group by default.
# With pip >= 25.1, use `pip install -e ".[io,examples]" --group dev`.
[dependency-groups]
test = ["pytest>=8.3", "pytest-xdist>=3.6", "pytest-timeout>=2.3.1", "jbubble[io,examples]"]
lint = ["ruff>=0.16.10", "ty==0.0.84"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "prek>=0.5"]
# Today's MkDocs site. A later release moves the docs to Zensical.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.0",
]

[tool.hatch.version]
source = "vcs"
# Same scheme as the old setuptools-scm config. The fallback only applies to a
# source tree with no git metadata and no .git_archival.txt.
raw-options = { version_scheme = "no-guess-dev", local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
include = ["/jbubble", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
# Ships every file under jbubble/ that git doesn't ignore, including non-Python
# package data such as py.typed.
packages = ["jbubble"]

# ── Ruff: linting + formatting ────────────────────────────────────────────────
# Ruff and ty infer the target Python from `requires-python`.

[tool.ruff]
line-length = 88
src = ["jbubble", "tests"]

[tool.ruff.lint]
# D301: docstrings that contain backslashes (for example LaTeX) must be raw.
select = ["E", "F", "I", "UP", "B", "SIM", "D301"]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function call in default argument (common JAX pattern)
    "SIM108",  # ternary operator — often less readable in scientific code
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402", "I001", "B007", "B023", "F841"]  # example scripts are more lenient
"jbubble/__init__.py" = ["E402"]  # jax.config.update must precede all imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty: type checking ─────────────────────────────────────────────────────────
# ty needs no configuration here. With equinox older than 0.13.7, it reports
# false positives on eqx.Module constructors, so run it in the locked
# environment: `uv run ty check jbubble`.

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--tb=short", "--strict-markers", "--strict-config"]
xfail_strict = false
filterwarnings = [
    "ignore::DeprecationWarning:jax",
    "ignore::UserWarning:diffrax",
]
markers = [
    "slow: marks tests that are slow (e.g. vmap over many radii)",
]
